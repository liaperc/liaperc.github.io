<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alumni Destinations</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --border: #252830;
      --text: #e8e6df;
      --muted: #7a7d8a;
      --accent: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
    }

    header { text-align: center; margin-bottom: 48px; }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header h1 em { font-style: italic; color: var(--accent); }

    header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 100%;
      max-width: 820px;
      padding: 40px 40px 32px;
    }

    .slider-section { margin-bottom: 36px; }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .slider-label span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .year-display {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .year-ticks { display: flex; justify-content: space-between; margin-bottom: 8px; }

    .year-ticks span {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.2s;
    }

    .year-ticks span:hover,
    .year-ticks span.active { color: var(--accent); }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      cursor: pointer;
    }

    .chart-area { display: flex; gap: 36px; align-items: flex-start; }

    .chart-wrap { flex: 0 0 300px; position: relative; }
    .chart-wrap canvas { display: block; }

    .chart-center-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .chart-center-label .n {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--text);
      display: block;
      line-height: 1;
    }

    .chart-center-label .label {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .legend { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 3px;
      transition: background 0.15s;
    }

    .legend-item:hover { background: rgba(255,255,255,0.04); }

    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .legend-name { font-size: 0.7rem; color: var(--text); flex: 1; letter-spacing: 0.02em; }
    .legend-pct { font-size: 0.7rem; color: var(--accent); font-weight: 500; min-width: 36px; text-align: right; }
    .legend-count { font-size: 0.65rem; color: var(--muted); min-width: 30px; text-align: right; }

    .divider { width: 100%; height: 1px; background: var(--border); margin: 28px 0 0; }

    .footer-note {
      display: block;
      margin-top: 14px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    #loading {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 40px 0;
    }

    @media (max-width: 640px) {
      .chart-area { flex-direction: column; }
      .chart-wrap { flex: none; width: 100%; max-width: 280px; margin: 0 auto; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Alumni <em>Job Sectors</em></h1>
  <p>Company/Org Sector by Graduating Class</p>
</header>

<div class="card">
  <div id="loading">Loading data...</div>
  <div id="app" style="display:none">
    <div class="slider-section">
      <div class="slider-label">
        <span>Graduating Class</span>
        <span class="year-display" id="yearDisplay"></span>
      </div>
      <div class="year-ticks" id="yearTicks"></div>
      <input type="range" id="classSlider" min="0" step="1" value="0">
    </div>

    <div class="chart-area">
      <div class="chart-wrap">
        <canvas id="pieChart" width="300" height="300"></canvas>
        <div class="chart-center-label">
          <span class="n" id="centerN"></span>
          <span class="label">responses</span>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="divider"></div>
    <span class="footer-note">Hover slices to inspect.</span>
  </div>
</div>

<script>
  const COLORS = [
    '#c8a96e','#6e9ec8','#c86e8a','#6ec8a4','#a46ec8',
    '#c8956e','#6ec8c8','#c8c86e','#8ac86e','#c86eb4',
    '#6e7ec8','#c8746e','#b0c86e','#6e8ac8'
  ];

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    lines.shift(); // remove header
    return lines.map(line => {
      const comma = line.indexOf(',');
      const year = parseInt(line.slice(0, comma).trim());
      const sector = line.slice(comma + 1).trim();
      return { year, sector };
    }).filter(d => !isNaN(d.year) && d.sector);
  }

  function processYear(data, year) {
    const counts = {};
    data.filter(d => d.year === year).forEach(d => {
      counts[d.sector] = (counts[d.sector] || 0) + 1;
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const total = sorted.reduce((s, [, v]) => s + v, 0);
    return { sorted, total };
  }

  let chart;

  function buildChart(data, colorMap, year) {
    const { sorted, total } = processYear(data, year);
    const labels = sorted.map(([s]) => s);
    const values = sorted.map(([, v]) => v);
    const colors = labels.map(l => colorMap[l]);

    document.getElementById('centerN').textContent = total;

    if (chart) {
      chart.setActiveElements([]);
      chart.tooltip.setActiveElements([]);
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.data.datasets[0].backgroundColor = colors;
      chart.data.datasets[0].borderColor = colors;
      chart.update();
    } else {
      const ctx = document.getElementById('pieChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            borderColor: colors,
            borderWidth: 2,
            hoverBorderWidth: 3,
            hoverOffset: 0,
          }]
        },
        options: {
          cutout: '62%',
          animation: { animateRotate: true, duration: 500 },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const pct = ((ctx.parsed / total) * 100).toFixed(1);
                  return `  ${ctx.label}: ${pct}% (${ctx.parsed})`;
                }
              },
              backgroundColor: '#1e2128',
              borderColor: '#2e3240',
              borderWidth: 1,
              titleColor: '#c8a96e',
              bodyColor: '#e8e6df',
              padding: 12,
              titleFont: { family: "'DM Serif Display', serif", size: 14 },
              bodyFont: { family: "'DM Mono', monospace", size: 12 },
            }
          }
        }
      });
    }

    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    sorted.forEach(([sector, count]) => {
      const pct = ((count / total) * 100).toFixed(1);
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="legend-dot" style="background:${colorMap[sector]}"></div>
        <span class="legend-name">${sector}</span>
        <span class="legend-pct">${pct}%</span>
        <span class="legend-count">${count}</span>
      `;
      legend.appendChild(item);
    });
  }

  fetch('Alumni Data Collection - JustCompSectAndClass.csv')
    .then(res => {
      if (!res.ok) throw new Error('Could not load CSV');
      return res.text();
    })
    .then(text => {
      const data = parseCSV(text);
      const classes = [...new Set(data.map(d => d.year))].sort();
      const allSectors = [...new Set(data.map(d => d.sector))].sort();
      const colorMap = {};
      allSectors.forEach((s, i) => { colorMap[s] = COLORS[i % COLORS.length]; });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      const slider = document.getElementById('classSlider');
      slider.max = classes.length - 1;

      const yearTicks = document.getElementById('yearTicks');
      classes.forEach((y, i) => {
        const span = document.createElement('span');
        span.textContent = y;
        if (i === 0) span.classList.add('active');
        span.addEventListener('click', () => { slider.value = i; update(i); });
        yearTicks.appendChild(span);
      });

      function update(idx) {
        const year = classes[idx];
        document.getElementById('yearDisplay').textContent = year;
        document.querySelectorAll('.year-ticks span').forEach((s, i) => {
          s.classList.toggle('active', i === idx);
        });
        buildChart(data, colorMap, year);
      }

      slider.addEventListener('input', () => update(parseInt(slider.value)));
      update(0);
    })
    .catch(err => {
      document.getElementById('loading').textContent = 'Error loading data: ' + err.message;
    });
</script>
</body>
</html>
